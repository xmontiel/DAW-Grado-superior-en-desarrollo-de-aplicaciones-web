<main class="container">
  <h2>Nueva Serie</h2>

  <div *ngIf="responseId" class="success">
    ✅ Serie creada correctamente. ID: <strong>{{ responseId }}</strong>
    <p>Redirigiendo a la lista...</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!responseId">
    <div class="field">
      <label for="title">Título</label>
      <input id="title" type="text" formControlName="title" placeholder="Ej: Breaking Bad" />
      <small *ngIf="title?.invalid && title?.touched">
        El título es obligatorio y debe tener al menos 3 caracteres.
      </small>
    </div>

    <div class="field">
      <label for="channel">Canal</label>
      <input id="channel" type="text" formControlName="channel" placeholder="Ej: AMC" />
      <small *ngIf="channel?.invalid && channel?.touched">
        El canal es obligatorio.
      </small>
    </div>

    <div class="field">
      <label for="rating">Rating (0 - 10)</label>
      <input id="rating" type="number" formControlName="rating" placeholder="Ej: 9.5" min="0" max="10" step="0.1" />
      <small *ngIf="rating?.invalid && rating?.touched">
        El rating es obligatorio y debe estar entre 0 y 10.
      </small>
    </div>

    <button type="submit" [disabled]="form.invalid || submitting">
      {{ submitting ? 'Enviando...' : 'Crear Serie' }}
    </button>
  </form>
</main>
