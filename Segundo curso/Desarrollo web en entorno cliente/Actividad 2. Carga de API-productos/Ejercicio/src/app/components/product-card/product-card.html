<div class="card h-100 border-0 shadow-sm position-relative overflow-hidden product-card">
  
  <div class="position-relative overflow-hidden" style="height: 200px;">
    <img [src]="product.image"
         class="card-img-top w-100 h-100"
         alt="{{ product.name }}"
         style="object-fit: cover; transition: transform 0.3s ease;">
    
    <div class="position-absolute top-0 end-0 m-2">
      <span class="badge rounded-pill px-3 py-2 shadow-sm"
            [class.bg-success]="product.active"
            [class.bg-secondary]="!product.active"
            style="backdrop-filter: blur(10px); background-color: rgba(var(--bs-success-rgb), 0.9) !important;">
        <i class="bi" [class.bi-check-circle-fill]="product.active" [class.bi-x-circle-fill]="!product.active"></i>
        {{ product.active ? 'Disponible' : 'No disponible' }}
      </span>
    </div>
  </div>

  <div class="card-body d-flex flex-column">
    
    <div class="mb-2">
      <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-3 py-2 rounded-pill fw-normal">
        <i class="bi bi-tag-fill me-1"></i>{{ product.category }}
      </span>
    </div>

    <h5 class="fw-bold mb-2 text-dark" style="font-size: 1.1rem;">
      {{ product.name }}
    </h5>

    <p class="text-muted small mb-3 flex-grow-1" style="line-height: 1.5;">
      {{ product.description }}
    </p>

    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-baseline">
        <span class="h4 fw-bold text-danger mb-0">{{ product.price }}</span>
        <span class="text-muted ms-1">€</span>
      </div>
    </div>

    <button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2"
            (click)="eliminar()"
            style="transition: all 0.3s ease;">
      <i class="bi bi-trash3"></i>
      <span>Eliminar producto</span>
    </button>

  </div>

</div>
